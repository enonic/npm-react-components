name: Build & Test

on:
    push:
    pull_request:

jobs:

    build:
        name: Build & Test
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: latest
            - run: npm ci
            - run: npm run build
            - run: npm test
